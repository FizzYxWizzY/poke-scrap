<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion Google</title>
  <style>
    body { font-family: sans-serif; font-size: 14px; text-align: center; padding: 50px; color:blanchedalmond; background-color: slategrey;}
    button { font-size: 18px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1 id="plop">Test Connexion via Google</h1>

  <div id="user-area">
    <button onclick="window.location.href='http://localhost:5000/auth/google'">Connexion avec Google</button>
  </div>

  <script>
    fetch('/user')
      .then(response => response.json())
      .then(json => {
        if (json.name) {
          document.getElementById('plop').textContent = json.name;
        }
        // document.getElementById('img_plop').src = json.picture;
      })
      .catch(error => {
        console.error('Erreur lors du fetch :', error);
      });
  </script>
</body>
</html>
