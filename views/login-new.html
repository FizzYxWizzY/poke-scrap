<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poke'Scrap - Login</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/styles.css?v=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .logo {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      box-shadow: var(--shadow-glow);
    }

    .login-title {
      font-size: 2rem;
      font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 32px;
    }

    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: white;
      color: #333;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
    }

    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .guest-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-hover);
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .guest-link:hover {
      color: var(--text-primary);
    }

    .features {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .features-title {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .feature-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: var(--bg-card-hover);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 36px 24px;
      }
      .logo {
        width: 80px;
        height: 80px;
      }
      .login-title {
        font-size: 1.6rem;
      }
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-glow);
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .modal-header h2 span {
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }
    .modal-close:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }
    .modal-body {
      padding: 24px;
    }
    .modal-footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
    }
    .contact-section h3 {
      margin: 0 0 8px 0;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .contact-desc {
      margin: 0 0 20px 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 0.9rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .form-group input:invalid,
    .form-group select:invalid,
    .form-group textarea:invalid {
      border-color: var(--error);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <a href="/" style="text-decoration: none;">
        <img src="/logo.png" alt="Poke'Scrap" class="logo">
        <h1 class="login-title">Poke'Scrap</h1>
      </a>
      <p class="login-subtitle">Find the best Pokémon deals</p>

      <a href="/auth/google" class="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Login with Google
      </a>

      <div class="divider">
        <span>or</span>
      </div>

      <a href="/api/scrapper" class="guest-link">
        🔍 Continue without account
      </a>

      <div class="features">
        <div class="features-title">Features</div>
        <div class="feature-list">
          <span class="feature-item">🔍 Free search</span>
          <span class="feature-item">⭐ Price alerts</span>
          <span class="feature-item">📧 Email notifications</span>
        </div>
      </div>
    </div>

    <div class="footer">
      © <span id="current-year"></span> Poke'Scrap — <button onclick="showContact()" style="background: none; border: none; color: var(--accent-hover); cursor: pointer; text-decoration: underline;">Contact</button>
    </div>
  </div>

  <!-- Contact Modal -->
  <div id="contactModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📧 <span>Contact Us</span></h2>
        <button class="modal-close" onclick="closeContact()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="contact-section">
          <h3>Get in Touch</h3>
          <p class="contact-desc">Have questions about Poke'Scrap? We'd love to hear from you!</p>
          <form class="contact-form" onsubmit="sendContact(event)">
            <div class="form-row">
              <div class="form-group">
                <label for="contactName">Name *</label>
                <input type="text" id="contactName" name="name" required>
              </div>
              <div class="form-group">
                <label for="contactEmail">Email *</label>
                <input type="email" id="contactEmail" name="email" required>
              </div>
            </div>
            <div class="form-group">
              <label for="contactSubject">Subject *</label>
              <select id="contactSubject" name="subject" required>
                <option value="">Select a subject</option>
                <option value="General Inquiry">General Inquiry</option>
                <option value="Bug Report">Bug Report</option>
                <option value="Feature Request">Feature Request</option>
                <option value="Account Support">Account Support</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="contactMessage">Message *</label>
              <textarea id="contactMessage" name="message" required></textarea>
            </div>
          </form>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeContact()">Cancel</button>
        <button class="btn-primary" onclick="sendContact(event)">Send Message</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>

  <!-- Contact Modal Functions -->
  <script>
    function showContact() {
      document.getElementById('contactModal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeContact() {
      document.getElementById('contactModal').style.display = 'none';
      document.body.style.overflow = '';
      // Reset form
      const form = document.querySelector('#contactModal form');
      if (form) form.reset();
    }

    async function sendContact(event) {
      event.preventDefault();
      
      const name = document.getElementById('contactName').value.trim();
      const email = document.getElementById('contactEmail').value.trim();
      const subject = document.getElementById('contactSubject').value;
      const message = document.getElementById('contactMessage').value.trim();

      if (!name || !email || !subject || !message) {
        alert('Please fill in all required fields.');
        return;
      }

      try {
        const res = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, subject, message })
        });

        if (res.ok) {
          alert('Message sent successfully!');
          closeContact();
        } else {
          const data = await res.json();
          alert('Failed to send message: ' + (data.error || 'Unknown error'));
        }
      } catch (err) {
        alert('Error sending message: ' + err.message);
      }
    }
  </script>
</body>
</html>
