<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>Poke'Scrap</title>
  <style>
    body { font-family: sans-serif; font-size: 14px; text-align: center; padding: 50px; color: #c1c1c1; background-color: #47284c;}
    table {
      font-size: 14px;
      margin: 20px auto;
      border-collapse: collapse;
      width: 80%;
    }

    th, td {
      border: 1px solid #c1c1c1;
      padding: 8px;
    }

    th {
      background-color: #232943;
      color: #c1c1c1;
    }

    td {
      background-color: #30385a;
      color: #c1c1c1;
    }
    button.delete-btn {
      background-color: #cc3333;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
    }
    button.delete-btn:hover {
      background-color: #ff5555;
    }
  </style>
</head>
<body>
  <img src="/logo.png" alt="logo" width="200px">
  <h1>Ma Watchlist</h1>
  <table id="watchlist-table">
    <thead>
      <tr>
        <th>Catégorie</th>
        <th>Langue</th>
        <th>Pays</th>
        <th>Série</th>
        <th>Prix ciblé (€)</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="watchlist-body">
      <!-- rempli par JS -->
    </tbody>
  </table>

  <script>
    async function fetchWatchlist() {
      try {
        const res = await fetch('/api/watchlists');
        const data = await res.json();

        const tbody = document.getElementById('watchlist-body');
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">Aucune alerte trouvée.</td></tr>';
          return;
        }

        data.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.articleCategorie}</td>
            <td>${item.articleLanguage}</td>
            <td>${item.sellerCountry}</td>
            <td>${item.articleName}</td>
            <td>${item.targetPrice.toFixed(2)}</td>
            <td><button class="delete-btn" onclick="deleteWatchlist('${item._id}')">❌</button></td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        alert('Erreur lors du chargement de la watchlist : ' + err.message);
      }
    }

    async function deleteWatchlist(id) {
      if (!confirm('Supprimer cette alerte ?')) return;

      try {
        const res = await fetch(`/api/watchlists/${id}`, {
          method: 'DELETE'
        });
        const data = await res.json();

        if (res.ok) {
          fetchWatchlist(); // refresh
        } else {
          alert(data.error || 'Erreur lors de la suppression.');
        }
      } catch (err) {
        alert('Erreur réseau : ' + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', fetchWatchlist);
  </script>
</body>
</html>
