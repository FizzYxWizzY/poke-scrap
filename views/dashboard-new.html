<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poke'Scrap - Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-card-hover: #252542;
      --bg-input: #16162a;
      --accent: #6c5ce7;
      --accent-hover: #8b7cf7;
      --accent-glow: rgba(108, 92, 231, 0.3);
      --success: #00b894;
      --warning: #fdcb6e;
      --error: #e74c3c;
      --text-primary: #ffffff;
      --text-secondary: #a0a0b8;
      --text-muted: #6c6c80;
      --border: #2d2d44;
      --border-light: #3d3d5c;
      --gradient-1: linear-gradient(135deg, #6c5ce7 0%, #a855f7 100%);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 20px var(--accent-glow);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
    }
    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-buttons {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--gradient-1);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }
    .btn-secondary {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--border-light);
      border-color: var(--accent);
    }
    .btn-danger {
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
    }
    .btn-danger:hover {
      background: var(--error);
      color: white;
    }

    .main-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px 120px;
    }

    .welcome-section {
      text-align: center;
      margin-bottom: 48px;
    }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: var(--shadow-md);
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid var(--accent);
      box-shadow: var(--shadow-glow);
      object-fit: cover;
    }

    .profile-name {
      font-size: 2rem;
      font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-greeting {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
      margin-top: 20px;
    }

    .action-card {
      background: var(--bg-card-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
    }

    .action-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: var(--shadow-glow);
    }

    .action-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .action-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .action-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .header-content {
        flex-direction: column;
        gap: 12px;
      }
      .profile-card {
        padding: 32px 24px;
      }
      .profile-avatar {
        width: 100px;
        height: 100px;
      }
      .profile-name {
        font-size: 1.5rem;
      }
    }

    .message {
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      text-align: center;
      font-weight: 500;
    }
    .message.success {
      background: rgba(0, 184, 148, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .message.error {
      background: rgba(231, 76, 60, 0.15);
      color: var(--error);
      border: 1px solid var(--error);
    }
    .message.hidden { display: none; }
  </style>
</head>
<body>
  <div id="message-container" class="message hidden"></div>
  <header class="header">
    <div class="header-content">
      <a href="/" class="logo-section" style="text-decoration: none;">
        <img src="/logo.png" alt="Poke'Scrap" class="logo">
        <span class="logo-text">Poke'Scrap</span>
      </a>
      <nav class="nav-buttons">
        <a href="/api/scrapper" class="btn btn-secondary">🔍 Search</a>
        <a href="/api/watch" class="btn btn-primary">⭐ Watchlist</a>
        <button onclick="logout()" class="btn btn-danger">Logout</button>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="profile-card">
      <img id="user-avatar" class="profile-avatar" src="" alt="Profile picture">
      <div class="profile-greeting">Welcome,</div>
      <h1 class="profile-name" id="user-name">Loading...</h1>
      
      <div class="action-grid">
        <a href="/api/scrapper" class="action-card">
          <div class="action-icon">🔍</div>
          <div class="action-title">Search</div>
          <div class="action-desc">Find Pokémon cards and products</div>
        </a>
        <a href="/api/watch" class="action-card">
          <div class="action-icon">⭐</div>
          <div class="action-title">My Watchlist</div>
          <div class="action-desc">Manage your price alerts</div>
        </a>
        <button onclick="logout()" class="action-card">
          <div class="action-icon">🚪</div>
          <div class="action-title">Logout</div>
          <div class="action-desc">Sign out of your account</div>
        </button>
      </div>
    </div>
  </main>

  <footer class="footer">
    © <span id="current-year"></span> Poke'Scrap — <a href="mailto:pokescrap.project@gmail.com" style="color: var(--accent-hover);">Contact</a>
  </footer>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
    
    const messageContainer = document.getElementById('message-container');

    function showMessage(text, type = 'error') {
      messageContainer.textContent = text;
      messageContainer.className = 'message ' + type;
      setTimeout(() => { messageContainer.className = 'message hidden'; }, 4000);
    }
    
    function logout() {
      fetch('/api/logout', {
        method: 'GET',
        headers: {
          'X-Requested-With': 'XMLHttpRequest',
          'Accept': 'application/json'
        }
      })
      .then(response => {
        if (response.ok) {
          return response.json();
        } else {
          throw new Error('Logout failed');
        }
      })
      .then(data => {
        if (data.success) {
          // Hide logout buttons and show login prompt
          document.querySelectorAll('a[href="/api/logout"]').forEach(link => {
            link.style.display = 'none';
          });
          document.querySelectorAll('.btn-danger').forEach(btn => {
            if (btn.textContent === 'Logout') btn.style.display = 'none';
          });
          
          // Show success message and redirect after delay
          showMessage('Logged out successfully!', 'success');
          setTimeout(() => {
            window.location.href = '/api/scrapper';
          }, 1000);
        }
      })
      .catch(error => {
        console.error('Logout error:', error);
        // Even if there's an error, assume logout worked and redirect
        showMessage('Logged out successfully!', 'success');
        setTimeout(() => {
          window.location.href = '/api/scrapper';
        }, 1000);
      });
    }
    
    fetch('/api/user')
      .then(response => response.json())
      .then(data => {
        document.getElementById('user-name').textContent = data.name;
        document.getElementById('user-avatar').src = data.picture;
      })
      .catch(error => {
        console.error('Erreur lors du fetch :', error);
        window.location.href = '/';
      });
  </script>
</body>
</html>
