<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Poke'Scrap - Ma Watchlist</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <img src="/logo.png" alt="logo" class="logo">
  <h1>Ma Watchlist</h1>

  <table id="watchlist-table">
    <thead>
      <tr>
        <th>Catégorie</th>
        <th>Langue</th>
        <th>Pays</th>
        <th>Série</th>
        <th>Prix ciblé (€)</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="watchlist-body"></tbody>
  </table>

  <div class="user-area">
    <button onclick="window.location.href='/api/scrapper'">Rechercher</button>
    <button onclick="window.location.href='/api/logout'">Déconnexion</button>
  </div>

  <script>
    async function fetchWatchlist() {
      try {
        const res = await fetch('/api/watchlists');
        const data = await res.json();

        const tbody = document.getElementById('watchlist-body');
        tbody.innerHTML = '';

        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="6">Aucune alerte trouvée.</td></tr>';
          return;
        }

        data.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.articleCategorie}</td>
            <td>${item.articleLanguage}</td>
            <td>${item.sellerCountry}</td>
            <td>
              ${item.articleImage ? `<img src="/images/${item.articleImage}" style="width: 80px; height: 80px; object-fit: contain; border-radius: 4px; vertical-align: middle; margin-right: 10px;">` : ''}
              ${item.articleName}
            </td>
            <td>${item.targetPrice.toFixed(2)}</td>
            <td><button class="delete-btn" onclick="deleteWatchlist('${item._id}')">❌</button></td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        alert('Erreur lors du chargement de la watchlist : ' + err.message);
      }
    }

    async function deleteWatchlist(id) {
      if (!confirm('Supprimer cette alerte ?')) return;

      try {
        const res = await fetch(`/api/watchlists/${id}`, { method: 'DELETE' });

        if (res.ok) {
          fetchWatchlist();
        } else {
          const data = await res.json();
          alert(data.error || 'Erreur lors de la suppression.');
        }
      } catch (err) {
        alert('Erreur réseau : ' + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', fetchWatchlist);
  </script>
</body>
</html>
