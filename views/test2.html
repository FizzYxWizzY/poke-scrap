<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Poke'Scrap</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    body { font-family: sans-serif; font-size: 14px; text-align: center; padding: 50px; color: #c1c1c1; background-color: #47284c;}
    button { font-size: 18px; padding: 10px 20px; }
    button:hover { border: solid 2px #31395a }
    #img_plop { margin-bottom: 20px; border-radius: 100%; }
  </style>
</head>
<body>
  <img src="/logo.png" alt="logo" width="200px">
  <h1>Hi, <span id="plop"></span>!</h1>
  <img id="img_plop" src="" alt="Photo de profil" width="100px" />

  <div id="user-area">
    <button onclick="window.location.href='/api/scrapper'">Scrap !</button>
    <button onclick="window.location.href='/api/logout'">Deconnexion</button>
  </div>

  <script>

    // document.getElementById('plop').textContent = req.session.displayName;
    // document.getElementById('img_plop').src = req.session.userPicture;
    fetch('/api/user')
      .then(response => response.json())
      .then(json => {
        document.getElementById('plop').textContent = json.name;
        document.getElementById('img_plop').src = json.picture;
      })
      .catch(error => {
        console.error('Erreur lors du fetch :', error);
      });
  </script>

</body>
</html>
